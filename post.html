<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>出 post 助手 — 852hk.81jp</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&family=Noto+Sans+HK:wght@300;400;500;700&family=Noto+Serif+TC:wght@200;500&family=Noto+Sans+TC:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#f7f6f3; --card:#fff; --ink:#1a1a1a; --muted:#888; --border:#e8e6e1;
    --hk:#c0392b; --tw:#2980b9; --general:#6d597a; --ok:#2e7d32; --okbg:#e8f5e9;
  }
  body{font-family:'Noto Sans HK',sans-serif;background:var(--bg);color:var(--ink);
       -webkit-font-smoothing:antialiased;padding-bottom:60px}

  .topbar{position:sticky;top:0;z-index:50;background:rgba(247,246,243,.94);
    backdrop-filter:blur(12px);border-bottom:1px solid var(--border);height:56px;
    display:flex;align-items:center;justify-content:space-between;padding:0 20px}
  .brand{font-family:'Shippori Mincho',serif;font-size:17px;font-weight:600;
    letter-spacing:3px;color:var(--ink);text-decoration:none}
  .back{font-size:12px;color:var(--muted);text-decoration:none}
  .back:hover{color:var(--ink)}

  .wrap{max-width:760px;margin:0 auto;padding:24px 20px}
  h1{font-family:'Shippori Mincho',serif;font-size:22px;font-weight:600;margin-bottom:6px}
  .lede{font-size:13px;color:var(--muted);line-height:1.8;margin-bottom:22px}

  .panel{background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:18px;margin-bottom:18px}
  label.fl{display:block;font-size:12px;font-weight:500;margin-bottom:7px}
  textarea{width:100%;min-height:110px;border:1px solid var(--border);border-radius:8px;
    padding:11px 12px;font-family:inherit;font-size:13px;line-height:1.7;resize:vertical;
    background:var(--bg);color:var(--ink)}
  textarea:focus{outline:2px solid var(--general);outline-offset:1px;background:var(--card)}

  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .seg button{border:none;background:var(--card);padding:9px 16px;font-family:inherit;
    font-size:13px;cursor:pointer;color:var(--muted)}
  .seg button.on{background:var(--ink);color:#fff}
  .seg button:focus-visible{outline:2px solid var(--general);outline-offset:-2px}

  .go{border:none;background:var(--ink);color:#fff;padding:11px 22px;border-radius:8px;
    font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;margin-left:auto}
  .go:disabled{opacity:.45;cursor:default}

  .prog{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.8}
  .prog b{color:var(--ink);font-weight:500}

  .cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
  .pc{background:var(--card);border:1px solid var(--border);border-radius:10px;
    overflow:hidden;display:flex;flex-direction:column;position:relative}
  .pc.off{opacity:.4}
  .pc .pick{position:absolute;left:9px;top:9px;z-index:2;width:22px;height:22px;cursor:pointer}
  .pc a.im{display:block;aspect-ratio:1;background:var(--bg)}
  .pc a.im img{width:100%;height:100%;object-fit:cover;display:block}
  .pc .bd{padding:11px 12px 13px;display:flex;flex-direction:column;gap:4px;flex:1}
  .pc .br{font-size:10px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
  .nmrow{display:flex;gap:6px;align-items:center}
  .nmedit{flex:1;min-width:0;font-family:inherit;font-size:12.5px;font-weight:500;
    line-height:1.5;color:var(--ink);background:var(--bg);border:1px solid var(--border);
    border-radius:6px;padding:6px 8px}
  .nmedit:focus{outline:2px solid var(--general);outline-offset:1px;background:var(--card)}
  .undo{border:1px solid var(--border);background:var(--card);color:var(--muted);
    border-radius:6px;width:26px;height:26px;flex:none;cursor:pointer;
    font-size:13px;line-height:1;padding:0}
  .undo:hover{border-color:var(--ink);color:var(--ink)}
  .pc .orig{font-size:10px;color:var(--muted);line-height:1.5;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pc .pr{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
  .pc .pr s{font-size:11px;font-weight:400;color:var(--muted);margin-left:6px}
  .pc .lo{font-size:12px;font-weight:500;font-variant-numeric:tabular-nums}
  .pc .off-tag{position:absolute;right:9px;top:9px;background:var(--hk);color:#fff;
    font-size:10px;font-weight:700;padding:3px 6px;border-radius:4px}
  .pc .st{font-size:10.5px;color:var(--muted);line-height:1.6}
  .pc .err{padding:14px;font-size:12px;color:var(--hk);line-height:1.7}

  .out{white-space:pre-wrap;font-size:13px;line-height:1.85;background:var(--bg);
    border:1px solid var(--border);border-radius:8px;padding:14px;
    font-family:inherit;word-break:break-word}
  .tools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .cp{border:1px solid var(--border);background:var(--card);color:var(--ink);
    padding:8px 14px;border-radius:7px;font-family:inherit;font-size:12.5px;cursor:pointer}
  .cp:hover{border-color:var(--ink)}
  .cp.done{background:var(--okbg);border-color:var(--ok);color:var(--ok)}

  h2{font-size:14px;font-weight:700;margin-bottom:11px;display:flex;align-items:baseline;gap:9px}
  h2 span{font-size:11px;font-weight:400;color:var(--muted)}
  .hide{display:none}
  a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--general);outline-offset:2px}
</style>
</head>
<body>

<div class="topbar">
  <a class="brand" href="/">852hk.81jp</a>
  <a class="back" href="/">← 返首頁</a>
</div>

<div class="wrap">
  <h1>出 post 助手</h1>
  <p class="lede">
    貼低 Nissen 或者 ZOZOTOWN 嘅<strong>商品網址</strong>（一行一條），
    幫你攞返商品相、譯好嘅名同埋計好嘅價錢，再寫埋文案同 hashtag。
  </p>

  <div class="panel">
    <label class="fl" for="urls">商品網址（一行一條，最多 10 條）</label>
    <textarea id="urls" placeholder="https://www.nissen.co.jp/item/...&#10;https://zozo.jp/shop/.../"></textarea>
    <div class="row">
      <div class="seg" id="regSeg">
        <button type="button" data-r="hk" class="on">🇭🇰 香港版</button>
        <button type="button" data-r="tw">🇹🇼 台灣版</button>
      </div>
      <label style="font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;">
        每個 post
        <select id="perPost" style="font-family:inherit;font-size:13px;padding:8px 9px;
                border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--ink);">
          <option>2</option><option selected>3</option><option>4</option><option>5</option>
          <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
        </select>
        件
      </label>
      <button class="go" id="goBtn" type="button">攞資料</button>
    </div>
    <div class="prog" id="prog"></div>
  </div>

  <div id="cardsPanel" class="panel hide">
    <h2>商品 <span id="pickCount"></span></h2>
    <div class="cards" id="cards"></div>
  </div>

  <div id="capPanel" class="panel hide">
    <h2>文案 <span id="capHint">撳張相可以開原圖，長撳就儲存到</span></h2>
    <div class="tools" id="postTabs" style="margin:0 0 11px"></div>
    <div class="out" id="caption"></div>
    <div class="tools">
      <button class="cp" type="button" data-copy="caption">複製文案</button>
      <button class="cp" type="button" data-copy="tags">複製 hashtag</button>
      <button class="cp" type="button" data-copy="both">連 hashtag 一齊複製</button>
      <button class="cp" type="button" id="saveBtn"
              style="border-color:var(--general);color:var(--general);">💾 存落 Google Sheet</button>
    </div>
    <p class="prog" id="saveMsg"></p>
  </div>

  <div id="tagPanel" class="panel hide">
    <h2>Hashtag</h2>
    <div class="out" id="tags"></div>
  </div>

  <div id="cardPanel" class="panel hide">
    <h2>出 post 卡 <span id="cardHint"></span></h2>
    <div class="cards" id="cardOut"></div>
  </div>
</div>

<script>
const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzgsFv9_AjExH0VCh1m6DX18qTmXMKwO0xiBGQfYqvO2Q6nb5ZNeXRbsdRsbGVcFidIQw/exec";
const SUPA_URL = 'https://pksqfpirggvsftvqrtji.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBrc3FmcGlyZ2d2c2Z0dnFydGppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MDE3MDQsImV4cCI6MjA5Nzk3NzcwNH0.TyGBeMNn91UCNEVhT-q4ivtgvXQL_GOLmdvtGMUIWuc';

// 匯率同運費跟返 admin 嗰版設定，唔好喺呢度另外寫死一份
const CFG = { hk: 0.057, tw: 0.24, shipHk: 4.5, shipTw: 20 };
(async () => {
  try {
    const r = await fetch(SUPA_URL + '/rest/v1/app_settings?select=key,value',
      { headers: { apikey: SUPA_KEY, Authorization: 'Bearer ' + SUPA_KEY } });
    if (!r.ok) return;
    for (const row of await r.json()) {
      const v = parseFloat(row.value);
      if (!(v > 0)) continue;
      if (row.key === 'rate_hk')     CFG.hk = v;
      if (row.key === 'rate_tw')     CFG.tw = v;
      if (row.key === 'ship_hk_50g') CFG.shipHk = v;
      if (row.key === 'ship_tw_50g') CFG.shipTw = v;
    }
    if (items.length) render();
  } catch (e) {}
})();

const SRC = {
  nissen: { label: 'NISSEN',   action: 'getNissenProduct', re: /nissen\.co\.jp/i },
  zozo:   { label: 'ZOZOTOWN', action: 'getZozoProduct',   re: /zozo\.jp/i },
};
const srcOf = (u) => Object.keys(SRC).find(k => SRC[k].re.test(u)) || null;

let region = 'hk';
let items = [];
let curPost = 0;   // 預覽緊第幾個 post

// IG carousel 要每個 post 張數一樣，Make 先至 map 得死 —— 所以夠一組就切一組，
// 唔夠一組嘅尾數唔會存，留返喺頁面度等你揀多幾件。
const perPost = () => parseInt($('perPost').value) || 3;
function postGroups() {
  const picked = items.filter(i => !i.error && i.pick);
  const n = perPost();
  const groups = [];
  for (let i = 0; i + n <= picked.length; i += n) groups.push(picked.slice(i, i + n));
  return { groups, left: picked.length % n, picked };
}

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s)
  .replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

document.querySelectorAll('#regSeg button').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('#regSeg button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    region = b.dataset.r;
    if (items.length) render();
  });
});

$('goBtn').addEventListener('click', run);
$('perPost').addEventListener('change', () => { curPost = 0; if (items.length) render(); });

async function run() {
  const urls = $('urls').value.split('\n').map(s => s.trim())
    .filter(Boolean).slice(0, 10);
  if (!urls.length) { $('prog').textContent = '請先貼低商品網址。'; return; }

  const bad = urls.filter(u => !srcOf(u));
  if (bad.length) {
    $('prog').innerHTML = '❌ 呢啲唔係 Nissen ／ ZOZOTOWN 嘅網址：<br>' +
      bad.map(u => '　' + esc(u)).join('<br>');
    return;
  }

  $('goBtn').disabled = true;
  items = [];
  $('cardsPanel').classList.add('hide');
  $('capPanel').classList.add('hide');
  $('tagPanel').classList.add('hide');

  // 逐條攞。GAS 一次得一個請求，同時發會塞住。
  for (let i = 0; i < urls.length; i++) {
    const url = urls[i];
    const key = srcOf(url);
    $('prog').innerHTML = `攞緊第 <b>${i + 1}</b> / ${urls.length} 件 —— ${SRC[key].label}…`;
    items.push(await fetchOne(url, key));
    render();
  }

  $('prog').innerHTML = `✅ 攞晒 <b>${items.filter(i => !i.error).length}</b> / ${urls.length} 件。` +
    (items.some(i => i.error) ? ' 有幾件攞唔到，睇下面。' : '');
  $('goBtn').disabled = false;
}

async function fetchOne(url, key) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 45000);
  try {
    const res = await fetch(
      `${GAS_API_URL}?action=${SRC[key].action}&url=${encodeURIComponent(url)}`,
      { signal: ctrl.signal });
    const text = await res.text();
    let d;
    try { d = JSON.parse(text); }
    catch (e) { return { url, key, error: '伺服器回覆咗非預期內容，多數係 GAS 未重新部署。' }; }

    // 舊版 GAS 唔識呢個指令時，會跌落去商品清單嗰段，回一份唔相干嘅嘢
    if (!d.name && (d.currentSheet !== undefined || Array.isArray(d.products))) {
      return { url, key, error: '你部 GAS 仲未識呢個指令，要喺 Apps Script 重新部署（管理部署 → 新版本）。' };
    }
    if (d.error) return { url, key, error: d.message || d.error };
    if (!d.name && !d.price) return { url, key, error: '攞唔到商品資料，請確認網址。' };

    return {
      url, key,
      name: d.name || '',
      image: d.image || '',
      yen: d.price || 0,
      yenMax: d.priceMax || 0,
      origYen: d.origPrice || 0,
      discount: d.discountRate || 0,
      brand: d.brand || '',
      shop: d.shop || '',
      variants: d.variants || [],
      pick: true,
    };
  } catch (e) {
    return { url, key, error: e.name === 'AbortError' ? '等咗 45 秒都冇回覆，請再試一次。' : e.message };
  } finally { clearTimeout(timer); }
}

const rate = () => region === 'hk' ? CFG.hk : CFG.tw;
const cur  = () => region === 'hk' ? 'HK$' : 'NT$';
const local = (yen) => cur() + Math.ceil(yen * rate()).toLocaleString();

function render() {
  const ok = items.filter(i => !i.error);
  $('cardsPanel').classList.remove('hide');
  $('pickCount').textContent = ok.length
    ? `已揀 ${ok.filter(i => i.pick).length} / ${ok.length} 件` : '';

  $('cards').innerHTML = items.map((it, n) => {
    if (it.error) {
      return `<div class="pc"><div class="err">❌ ${esc(it.error)}<br>
        <span style="color:var(--muted);word-break:break-all;">${esc(it.url)}</span></div></div>`;
    }
    const inStock = (it.variants || []).flatMap(v => (v.sizes || v.subs || []))
      .filter(s => s && s.inStock).length;
    return `
      <div class="pc${it.pick ? '' : ' off'}">
        <input class="pick" type="checkbox" data-n="${n}" ${it.pick ? 'checked' : ''}
               aria-label="揀呢件出 post">
        ${it.discount ? `<span class="off-tag">${it.discount}%OFF</span>` : ''}
        <a class="im" href="${esc(it.image)}" target="_blank" rel="noopener">
          ${it.image ? `<img src="${esc(it.image)}" alt="" loading="lazy">` : ''}
        </a>
        <div class="bd">
          ${it.brand || it.shop ? `<p class="br">${esc([it.brand, it.shop].filter(Boolean).join(' · '))}</p>` : ''}
          <div class="nmrow">
            <input class="nmedit" data-n="${n}" value="${esc(dispName(it))}" maxlength="40"
                   aria-label="商品名（出 post 同張卡都用呢個）">
            <button class="undo" data-undo="${n}" type="button"
                    title="回復原本嘅名" ${it.editName === undefined ? 'hidden' : ''}>↺</button>
          </div>
          <p class="orig" title="${esc(it.name)}">原名：${esc(it.name)}</p>
          <p class="pr">¥${it.yen.toLocaleString()}${it.yenMax && it.yenMax !== it.yen ? '〜' + it.yenMax.toLocaleString() : ''}
            ${it.origYen && it.origYen > it.yen ? `<s>¥${it.origYen.toLocaleString()}</s>` : ''}</p>
          <p class="lo" style="color:var(--${region})">${local(it.yen)}${it.yenMax && it.yenMax !== it.yen ? '起' : ''}</p>
          ${inStock ? `<p class="st">${inStock} 個尺碼／顏色有貨</p>` : ''}
        </div>
      </div>`;
  }).join('');

  document.querySelectorAll('.pick').forEach(cb => {
    cb.addEventListener('change', () => {
      items[+cb.dataset.n].pick = cb.checked;
      render();
    });
  });

  // 改名唔可以重畫成個列表，唔係打一個字個游標就跳走
  document.querySelectorAll('.nmedit').forEach(inp => {
    inp.addEventListener('input', () => {
      items[+inp.dataset.n].editName = inp.value;
      // 只更新文案，唔重畫列表；粒回復掣自己現身就得
      const undo = document.querySelector(`[data-undo="${inp.dataset.n}"]`);
      if (undo) undo.hidden = false;
      renderCaption();
    });
  });
  document.querySelectorAll('[data-undo]').forEach(b => {
    b.addEventListener('click', () => {
      delete items[+b.dataset.undo].editName;
      render();
    });
  });

  renderCaption();
}

// 商品名：改過就用改咗嗰個，冇改就用斬短咗嘅原名
function dispName(it) {
  return it.editName !== undefined ? it.editName : shortName(it.name);
}

function renderCaption() {
  const { groups, left, picked } = postGroups();
  const n = perPost();

  if (!picked.length) {
    $('capPanel').classList.add('hide');
    $('tagPanel').classList.add('hide');
    return;
  }

  $('capPanel').classList.remove('hide');
  $('tagPanel').classList.remove('hide');

  if (!groups.length) {
    // 揀嘅唔夠砌一個 post
    $('postTabs').innerHTML = '';
    $('caption').textContent =
      `揀夠 ${n} 件先砌到一個 post，而家揀咗 ${picked.length} 件 —— 仲爭 ${n - picked.length} 件。`;
    $('tags').textContent = buildTags(picked);
    $('capHint').textContent = '';
    $('saveBtn').disabled = true;
    $('saveMsg').textContent = '';
    return;
  }

  $('saveBtn').disabled = false;
  if (curPost >= groups.length) curPost = 0;

  $('postTabs').innerHTML = groups.length > 1
    ? groups.map((g, i) =>
        `<button class="cp${i === curPost ? ' done' : ''}" type="button" data-post="${i}">Post ${i + 1}</button>`
      ).join('')
    : '';
  document.querySelectorAll('[data-post]').forEach(b => {
    b.addEventListener('click', () => { curPost = +b.dataset.post; render(); });
  });

  $('capHint').textContent = groups.length > 1
    ? `會存 ${groups.length} 個 post，每個 ${n} 件`
    : `1 個 post，${n} 件`;

  $('caption').textContent = buildCaption(groups[curPost]);
  $('tags').textContent = buildTags(groups[curPost]);

  $('saveMsg').innerHTML = left
    ? `⚠️ 仲有 <b>${left}</b> 件唔夠砌多一個 post，唔會存 —— 揀多 ${n - left} 件就砌到。`
    : '';
}

// ── 商品名 ────────────────────────────────────────────────
// 日本商品名成句都係賣點堆砌，「＜大尺碼有＞」「（附腰帶）」呢啲
// 出 post 冇人睇。斬走括號同分隔號之後嘅嘢，淨返最前面個主體。
function shortName(raw) {
  const full = String(raw || '').trim();
  let s = full;

  // 有啲名開頭就係「＜大尺碼＞」呢類規格前綴，剝走先，
  // 唔係一 split 就淨返個空字串。可能唔止一個前綴，所以要 loop。
  let prev;
  do {
    prev = s;
    s = s.replace(/^[（(＜<【[][^）)＞>】\]]*[）)＞>】\]]\s*/, '').trim();
  } while (s !== prev && s);

  // 剩低嘅括號（吸濕排汗、輕薄布料呢啲）成組拎走，唔好喺第一個括號就斬 ——
  // 「5/8 袖…」個名前面有規格前綴，一斬就淨返「5」。
  do {
    prev = s;
    s = s.replace(/[（(＜<【[][^）)＞>】\]]*[）)＞>】\]]/g, ' ').trim();
  } while (s !== prev && s);

  // 淨係當｜同・係分隔號。斜線唔算 —— 「5/8 袖」係尺寸唔係兩個名。
  s = s.split(/[｜|・]/)[0].trim();
  s = s.replace(/[\s　]+/g, ' ').replace(/[、,，。.]+$/, '');

  // 剝剩得一兩個字多數係剝錯咗，用返原名（淨係拆走括號符號）好過
  if (s.length < 4) {
    s = full.replace(/[（()）＜＞<>【】[\]]/g, ' ').replace(/\s+/g, ' ').trim();
  }

  const CAP = 18;                                  // 中文 18 個字，IG 上啱啱好一行
  return s.length > CAP ? s.slice(0, CAP) + '…' : s;
}

// ── 文案 ──────────────────────────────────────────────────
// 由真實商品資料砌出嚟：有折扣就行減價路線，冇就行推介路線。
function buildCaption(list) {
  const hk = region === 'hk';
  const shops = [...new Set(list.map(i => SRC[i.key].label))];
  const shopTxt = shops.join(' ＋ ');
  const best = list.reduce((a, b) => (b.discount || 0) > (a.discount || 0) ? b : a, list[0]);
  const onSale = list.filter(i => i.discount > 0);
  const cheapest = list.reduce((a, b) => b.yen < a.yen ? b : a, list[0]);

  const L = [];

  // 開場
  if (onSale.length) {
    L.push(hk
      ? `${shopTxt} 減緊 🔥 最平嗰件 ${local(cheapest.yen)} 就有`
      : `${shopTxt} 特價中 🔥 最低 ${local(cheapest.yen)} 就有`);
  } else {
    L.push(hk
      ? `${shopTxt} 今期推介 🇯🇵`
      : `${shopTxt} 本期推薦 🇯🇵`);
  }
  L.push('');

  // 逐件貨
  list.slice(0, 6).forEach((it, n) => {
    const nm = dispName(it);
    // ZOZO 好多商品名已經帶住品牌，唔好再前置多次
    const showBrand = it.brand &&
      !nm.toLowerCase().includes(it.brand.toLowerCase());
    const bits = [`${n + 1}. ${showBrand ? it.brand + ' ' : ''}${nm}`];
    let price = `　　¥${it.yen.toLocaleString()}`;
    if (it.yenMax && it.yenMax !== it.yen) price += '起';
    if (it.discount) price += hk ? `（減緊 ${it.discount}%）` : `（${it.discount}% OFF）`;
    bits.push(price);
    L.push(bits.join('\n'));
  });
  if (list.length > 6) {
    L.push(hk ? `⋯⋯仲有 ${list.length - 6} 件，DM 問我攞` : `⋯⋯還有 ${list.length - 6} 件，私訊我索取`);
  }
  L.push('');

  // 服務賣點
  if (hk) {
    L.push('⚖️ 國際運費只計實重，冇體積重 — 買衫最抵');
    L.push(`📦 到港運費 HK$${CFG.shipHk}／50g`);
    L.push('🚚 每兩星期由日本寄出，順豐到付／郵局易寄取／平郵任揀');
    L.push('');
    L.push('💬 想落單或者想問其他商品：');
    L.push('　① DM 我哋，貼低商品網址，即刻同你計');
    L.push('　② 上官網自己貼，秒出報價 — 連顏色尺碼、仲有冇貨都睇到');
    L.push('');
    L.push('🔗 jpshopper-852hk81jp.vercel.app');
    L.push('');
    L.push(onSale.length
      ? `${best.discount ? `減 ${best.discount}% ` : ''}唔知幾時完，見到心水唔好等 — 斷咗碼真係冇㗎喇 🥲`
      : '睇中直接落單，唔使等 ☺️');
  } else {
    L.push('⚖️ 國際運費只計實重，不算材積重 — 買衣服最划算');
    L.push(`📦 到台運費 NT$${CFG.shipTw}／50g，另加賣貨便國內運費 NT$38`);
    L.push('🚚 每月從日本寄出，到台後以賣貨便寄送');
    L.push('');
    L.push('💬 想下單或想問其他商品：');
    L.push('　① 私訊我們，貼上商品連結，馬上幫你算');
    L.push('　② 上官網自己貼，秒出報價 — 連顏色、尺寸、有沒有貨都看得到');
    L.push('');
    L.push('🔗 jpshopper-852hk81jp.vercel.app');
    L.push('');
    L.push(onSale.length
      ? `${best.discount ? `${best.discount}% OFF ` : ''}不知道什麼時候結束，看到喜歡的別猶豫 — 斷碼就真的沒了 🥲`
      : '看中直接下單，不用等回覆 ☺️');
  }

  return L.join('\n');
}

function buildTags(list) {
  const hk = region === 'hk';
  const shops = [...new Set(list.map(i => i.key))];
  const t = ['#日本代購'];
  // ZOZO 客要款，Nissen 客要實用平價，所以第二個 tag 唔同
  if (shops.includes('zozo') && hk) t.push('#日系穿搭');
  else t.push(hk ? '#香港代購' : '#台灣代購');
  t.push(shops.includes('zozo') ? '#zozotown代購' : '#nissen代購');
  return t.join(' ');
}

// ── 出 post 卡：喺瀏覽器度畫一張 1080×1350，中文字用返本機字型 ──
// 版式跟《商品卡版式規格》，改咗規格記住兩邊一齊改。
const CARD_W = 1080, CARD_H = 1350, M = 80;

// 每間鋪一套紙色。唔淨止換底 —— 細線、大編號、相框底都要一齊換色溫，
// 唔係暖色線配冷色紙會好污糟。墨黑同重點色兩邊共用。
const PAPER = {
  nissen: { paper:'#F2EFE9', rule:'#DDD8CE', seq:'#E0DBD1', shot:'#E4E0D7', muted:'#8A857C' },
  zozo:   { paper:'#E7E8E4', rule:'#D2D4CE', seq:'#D7D9D3', shot:'#DADCD6', muted:'#82857F' },
};
const CARD = { ink:'#1F1D1A', hk:'#C0392B', tw:'#2980B9' };

let fontsReady = null;
function loadCardFonts() {
  if (fontsReady) return fontsReady;
  fontsReady = Promise.all([
    document.fonts.load('200 104px "Noto Serif TC"'),
    document.fonts.load('500 54px "Noto Serif TC"'),
    document.fonts.load('400 23px "Noto Sans TC"'),
    document.fonts.load('500 56px "IBM Plex Mono"'),
  ]).then(() => document.fonts.ready);
  return fontsReady;
}

// 商品相由 GAS 代攞轉 data URI —— 直接載日本網站張相會整污糟塊 canvas
const picCache = new Map();
async function loadPic(url) {
  if (picCache.has(url)) return picCache.get(url);
  const p = (async () => {
    const res = await fetch(`${GAS_API_URL}?action=proxyImage&url=${encodeURIComponent(url)}`);
    const d = JSON.parse(await res.text());
    if (!d.dataUri) throw new Error(d.message || d.error || '攞唔到商品相');
    return await new Promise((ok, no) => {
      const im = new Image();
      im.onload = () => ok(im);
      im.onerror = () => no(new Error('張相載入唔到'));
      im.src = d.dataUri;
    });
  })();
  picCache.set(url, p);
  return p;
}

function drawCover(ctx, im, x, y, w, h) {
  const s = Math.max(w / im.width, h / im.height);
  const dw = im.width * s, dh = im.height * s;
  ctx.save();
  ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.drawImage(im, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
  ctx.restore();
}

// 逐個字試落去，唔用 measureText 估 —— 中英數混排先至準
function wrapText(ctx, text, maxW, maxLines) {
  const lines = [];
  let line = '';
  for (const ch of String(text)) {
    if (ctx.measureText(line + ch).width > maxW && line) {
      lines.push(line);
      if (lines.length === maxLines) return lines;
      line = ch;
    } else line += ch;
  }
  if (line) lines.push(line);
  if (lines.length > maxLines) {
    lines.length = maxLines;
    lines[maxLines - 1] = lines[maxLines - 1].slice(0, -1) + '…';
  }
  return lines;
}

async function drawCard(item, seq) {
  await loadCardFonts();
  const cv = document.createElement('canvas');
  cv.width = CARD_W; cv.height = CARD_H;
  const ctx = cv.getContext('2d');
  const accent = region === 'hk' ? CARD.hk : CARD.tw;
  const P = PAPER[item.key] || PAPER.nissen;
  const R = CARD_W - M;   // 右邊界

  ctx.fillStyle = P.paper;
  ctx.fillRect(0, 0, CARD_W, CARD_H);
  ctx.textBaseline = 'top';

  // 大隻淺色編號，擺最底層
  ctx.fillStyle = P.seq;
  ctx.font = '200 104px "Noto Serif TC", serif';
  ctx.textAlign = 'right';
  ctx.fillText(String(seq).padStart(2, '0'), R, 74);

  ctx.fillStyle = P.rule;
  ctx.fillRect(M, 96, CARD_W - M * 2, 1);
  ctx.fillRect(M, 1286, CARD_W - M * 2, 1);

  ctx.textAlign = 'left';
  ctx.fillStyle = P.muted;
  ctx.font = '400 23px "Noto Sans TC", sans-serif';
  ctx.letterSpacing = '6.9px';                 // 23px 嘅 0.3em
  ctx.fillText('日本代購', M, 110);

  // 商品相
  try {
    const im = await loadPic(item.image);
    drawCover(ctx, im, M, 180, 920, 820);
  } catch (e) {
    ctx.fillStyle = P.shot;
    ctx.fillRect(M, 180, 920, 820);
  }
  ctx.letterSpacing = '0px';
  ctx.strokeStyle = P.rule;
  ctx.lineWidth = 1;
  ctx.strokeRect(M + .5, 180.5, 919, 819);

  // 品牌
  // 一律出店舖名，唔出商品品牌 —— 成套卡睇落先至齊整
  const brand = SRC[item.key].label;
  ctx.fillStyle = P.muted;
  ctx.font = '400 23px "Noto Sans TC", sans-serif';
  ctx.letterSpacing = '5.98px';                // 0.26em
  ctx.fillText(brand, M, 1046);
  ctx.letterSpacing = '0px';

  // 商品名，最多兩行
  ctx.fillStyle = CARD.ink;
  ctx.font = '500 54px "Noto Serif TC", serif';
  wrapText(ctx, dispName(item), 600, 2)
    .forEach((ln, i) => ctx.fillText(ln, M, 1086 + i * 68));

  // 日圓價（唔出港幣／台幣 —— 匯率會變，張卡會留喺 feed 好耐）
  ctx.textAlign = 'right';
  ctx.fillStyle = accent;
  ctx.font = '500 56px "IBM Plex Mono", monospace';
  // 唔同碼唔同價嗰啲要寫「起」，唔係人哋照住最平嗰個價嚟問就麻煩
  const yenTxt = '¥' + item.yen.toLocaleString() +
    (item.yenMax && item.yenMax !== item.yen ? '起' : '');
  ctx.fillText(yenTxt, R, 1080);

  ctx.fillStyle = P.muted;
  ctx.font = '400 22px "Noto Sans TC", sans-serif';
  ctx.letterSpacing = '1.76px';                // 0.08em
  ctx.fillText(region === 'hk' ? '港幣報價 → DM' : '台幣報價 → 私訊', R, 1180);
  ctx.letterSpacing = '0px';

  ctx.fillStyle = accent;
  ctx.fillRect(R - 96, 1152, 96, 2);

  // 頁腳
  ctx.fillStyle = P.muted;
  ctx.font = '400 22px "Noto Sans TC", sans-serif';
  ctx.letterSpacing = '3.08px';                // 0.14em
  ctx.fillText('日本直送', R, 1302);
  ctx.textAlign = 'left';
  ctx.fillText(region === 'hk' ? '852hk.81jp' : '886tw.81jp', M, 1302);
  ctx.letterSpacing = '0px';

  // IG 個 API 只收 JPEG
  return await new Promise(ok => cv.toBlob(ok, 'image/jpeg', 0.92));
}

// 整完即刻俾你睇，唔使等 IG 出咗先發現有嘢唔妥
function showCards(urls, postNo) {
  $('cardPanel').classList.remove('hide');
  $('cardHint').textContent = `Post ${postNo}・已上載，Sheet 入面存嘅就係呢幾張`;
  $('cardOut').innerHTML = urls.map((u, i) => `
    <div class="pc">
      <a class="im" href="${esc(u)}" target="_blank" rel="noopener"
         style="aspect-ratio:4/5"><img src="${esc(u)}" alt="" loading="lazy"></a>
      <div class="bd"><p class="st">第 ${i + 1} 張・1080×1350 JPG</p></div>
    </div>`).join('');
  $('cardPanel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// ── 上載去 Cloudinary（IG 讀唔到 Google Drive，要條公開網址）──
const CLOUD_NAME = 'db7sjoxid';
const CLOUD_PRESET = 'jpshopper_post';   // Cloudinary 要開一個同名嘅 unsigned preset
async function uploadCard(blob, name) {
  const fd = new FormData();
  fd.append('file', blob, name);
  fd.append('upload_preset', CLOUD_PRESET);
  const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
    { method: 'POST', body: fd });
  const d = await res.json();
  if (!d.secure_url) {
    throw new Error(d.error && d.error.message
      ? `Cloudinary：${d.error.message}` : 'Cloudinary 上載失敗');
  }
  return d.secure_url;
}

// ── 存落 Google Sheet（俾 Make 讀去自動出 post）────────────
$('saveBtn').addEventListener('click', async () => {
  const { groups, left } = postGroups();
  if (!groups.length) return;

  const btn = $('saveBtn');
  btn.disabled = true;

  const rows = [];
  for (let g = 0; g < groups.length; g++) {
    const grp = groups[g];

    // 先整卡再存，唔係 Sheet 入面會留低日本網站嘅原相
    const cards = [];
    for (let k = 0; k < grp.length; k++) {
      $('saveMsg').innerHTML =
        `第 <b>${g + 1}</b> / ${groups.length} 個 post — 整緊第 ${k + 1} / ${grp.length} 張卡…`;
      try {
        const blob = await drawCard(grp[k], k + 1);
        cards.push(await uploadCard(blob, `post-${Date.now()}-${k + 1}.jpg`));
      } catch (e) {
        $('saveMsg').innerHTML =
          `❌ 整卡／上載失敗：${esc(e.message)}` +
          (/preset/i.test(e.message)
            ? '<br><span style="color:var(--muted)">Cloudinary 要開一個叫 <code>jpshopper_post</code> 嘅 unsigned upload preset —— Settings → Upload → Add upload preset → Signing mode 揀 Unsigned。</span>'
            : '') +
          (rows.length ? `<br>之前 ${rows.length} 個 post 已經存咗。` : '');
        btn.disabled = false;
        return;
      }
    }
    showCards(cards, g + 1);

    $('saveMsg').innerHTML = `存緊第 <b>${g + 1}</b> / ${groups.length} 個 post…`;
    const payload = {
      action: 'savePostDraft',
      region,
      shops: [...new Set(grp.map(i => SRC[i.key].label))].join(' + '),
      caption: buildCaption(grp),
      tags: buildTags(grp),
      items: grp.map((i, k) => ({
        name: dispName(i),
        image: cards[k],          // ← 出 post 卡，唔係原相
        url: i.url,
        yen: i.yen,
        discount: i.discount || 0,
      })),
    };

    // text/plain 唔會觸發 preflight，所以讀得返 GAS 嘅回覆，
    // 唔使好似其他頁咁 no-cors 靠估佢成功咗。
    try {
      const res = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload),
      });
      const d = JSON.parse(await res.text());
      if (d.result !== 'ok') {
        $('saveMsg').innerHTML =
          `❌ 第 ${g + 1} 個 post 存唔到：${esc(d.message || '未知原因')}` +
          (rows.length ? `<br>之前 ${rows.length} 個已經存咗（第 ${rows.join('、')} 行）。` : '');
        btn.disabled = false;
        return;
      }
      rows.push(d.row);
    } catch (e) {
      // 讀唔到回覆多數係 GAS 未重新部署，或者瀏覽器擋咗
      $('saveMsg').innerHTML =
        `⚠️ 存第 ${g + 1} 個 post 嗰陣收唔到 GAS 回覆，未確定存唔存到。<br>` +
        '<span style="color:var(--muted)">多數係 GAS 未重新部署（管理部署 → 新版本）。' +
        '請去 Google Sheet 睇下「出Post」分頁有冇新行，唔好即刻再撳，會存多次。</span>';
      btn.disabled = false;
      return;
    }
  }

  $('saveMsg').innerHTML =
    `✅ 已存 <b>${rows.length}</b> 個 post 落「出Post」分頁（第 ${rows.join('、')} 行），` +
    `每個 ${perPost()} 件，狀態「待出」。` +
    (left ? `<br>⚠️ 仲有 ${left} 件唔夠一個 post，冇存。` : '');
  btn.classList.add('done');
  setTimeout(() => btn.classList.remove('done'), 2000);
  btn.disabled = false;
});

// ── 複製 ──────────────────────────────────────────────────
document.querySelectorAll('.cp').forEach(b => {
  b.addEventListener('click', async () => {
    const what = b.dataset.copy;
    const text = what === 'caption' ? $('caption').textContent
               : what === 'tags'    ? $('tags').textContent
               : $('caption').textContent + '\n\n' + $('tags').textContent;
    try {
      await navigator.clipboard.writeText(text);
      const was = b.textContent;
      b.textContent = '✅ 複製咗';
      b.classList.add('done');
      setTimeout(() => { b.textContent = was; b.classList.remove('done'); }, 1600);
    } catch (e) {
      b.textContent = '複製唔到，請自己長撳揀字';
    }
  });
});
