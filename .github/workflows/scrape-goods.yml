name: 🛍️ 抓取日本商品清單

# 喺 GitHub 個伺服器度跑抓取工具，唔使自己部電腦裝任何嘢。
# 用法：Actions 分頁 → 揀「🛍️ 抓取日本商品清單」→ 撳 Run workflow
#       行完喺同一頁最底下載 goods-csv 個 zip。

on:
  workflow_dispatch:
    inputs:
      url:
        description: '商品頁網址（多過一條就用空格分開）'
        required: true
        default: 'https://chiikawapark-tokyo.jp/goods/'
      crawl:
        description: '自動跟住分頁／分類連結逐頁抓（商品分散喺多個頁面時要開）'
        type: boolean
        default: true
      max_pages:
        description: '自動抓最多幾多頁'
        required: false
        default: '60'
      venue_only:
        description: '只要現場買得到嘅貨（剔走「オンライン限定」）'
        type: boolean
        default: true
      expect:
        description: '預期最少幾多件（抓唔夠會出警告，填 0 = 唔檢查）'
        required: false
        default: '400'
      max_scroll:
        description: '最多向下捲幾多次（貨多就調大啲）'
        required: false
        default: '80'
      twd_rate:
        description: '日幣→台幣匯率'
        required: false
        default: '0.22'
      commit_to_repo:
        description: '把 CSV 存入 repo 嘅 data/ 資料夾（唔使去 Artifacts 下載）'
        type: boolean
        default: true

permissions:
  contents: write   # 要寫返 CSV 入 repo

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 50   # --crawl 抓幾十頁要時間

    steps:
      - name: 攞 code
        uses: actions/checkout@v4

      - name: 裝 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 裝 Playwright 同瀏覽器
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: 開始抓取
        id: scrape
        continue-on-error: true          # 就算失敗都要上傳 debug 檔
        run: |
          ARGS=""
          if [ "${{ inputs.venue_only }}" = "true" ]; then ARGS="$ARGS --venue-only"; fi
          if [ "${{ inputs.crawl }}" = "true" ]; then ARGS="$ARGS --crawl --max-pages ${{ inputs.max_pages }}"; fi
          if [ "${{ inputs.expect }}" != "0" ]; then ARGS="$ARGS --expect ${{ inputs.expect }}"; fi
          ARGS="$ARGS --max-scroll ${{ inputs.max_scroll }} --rate ${{ inputs.twd_rate }} --debug"

          echo "▶ 執行：node tools/scrape-goods.mjs ${{ inputs.url }} $ARGS"
          echo ""
          node tools/scrape-goods.mjs ${{ inputs.url }} $ARGS 2>&1 | tee run-log.txt

      - name: 存入 repo 嘅 data/ 資料夾
        if: ${{ inputs.commit_to_repo && hashFiles('goods.csv') != '' }}
        run: |
          mkdir -p data
          cp goods.csv        data/goods.csv
          cp goods-review.csv data/goods-review.csv 2>/dev/null || true
          # debug 檔一齊存入 repo，Claude 可以直接 pull 落嚟睇真實頁面結構
          cp debug-dump.json  data/debug-dump.json  2>/dev/null || true
          cp run-log.txt      data/run-log.txt      2>/dev/null || true

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/

          if git diff --staged --quiet; then
            echo "📋 內容同上次一樣，唔使 commit"
          else
            N=$(( $(wc -l < goods.csv) - 1 ))
            git commit -m "抓取商品清單：${N} 件（${{ inputs.url }}）"
            git push
            echo "✅ 已存入 data/goods.csv（${N} 件）"
          fi

      - name: 整理結果摘要
        if: always()
        run: |
          {
            echo "## 🛍️ 抓取結果"
            echo ""
            if [ -f goods.csv ]; then
              # 減一係因為第一行係標題
              N=$(( $(wc -l < goods.csv) - 1 ))
              echo "✅ **抓到 $N 件商品**（已寫入 \`goods.csv\`）"
            else
              echo "❌ **冇出到 CSV** —— 睇下面 log 同下載 debug-dump.json"
            fi
            echo ""
            echo "### 執行記錄"
            echo '```'
            tail -40 run-log.txt 2>/dev/null || echo '(冇 log)'
            echo '```'
            echo ""
            if [ "${{ inputs.commit_to_repo }}" = "true" ]; then
              echo "📁 CSV 已存入 repo：[\`data/goods.csv\`](../../blob/main/data/goods.csv) ・ [\`data/goods-review.csv\`](../../blob/main/data/goods-review.csv)"
              echo ""
            fi
            echo "📥 亦可喺呢一頁最底 **Artifacts** 下載 \`goods-csv\`（記住要喺 run 頁面，唔係 job 頁面）。"
          } >> $GITHUB_STEP_SUMMARY

      - name: 上傳 CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goods-csv
          path: |
            goods.csv
            goods-review.csv
            debug-dump.json
            run-log.txt
          if-no-files-found: warn
          retention-days: 30
