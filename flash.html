<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>現貨搶購 — 852hk.81jp</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink: #111;
      --muted: #6b7280;
      --border: #e5e7eb;
      --bg: #f4f5f7;
      --card: #fff;
      --hk: #c0392b;
      --tw: #2980b9;
      --green: #059669;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Topbar ── */
    .topbar {
      background: #111;
      color: #fff;
      padding: 0 16px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .topbar-logo { font-size: 14px; font-weight: 700; letter-spacing: 3px; }
    .topbar-back {
      color: #aaa; font-size: 13px; text-decoration: none;
      display: flex; align-items: center; gap: 4px;
    }
    .topbar-back:hover { color: #fff; }

    /* ── Layout ── */
    .container { max-width: 480px; margin: 0 auto; padding: 20px 16px 60px; }

    /* ── Loading ── */
    .loading {
      text-align: center; padding: 60px 20px;
      color: var(--muted); font-size: 14px;
    }
    .loading-spinner {
      width: 32px; height: 32px;
      border: 3px solid #e5e7eb;
      border-top-color: #111;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Flash Card ── */
    .flash-card {
      background: var(--card);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
    }

    /* ── Status Banner ── */
    .status-banner {
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      letter-spacing: 0.3px;
    }
    .status-banner.grabbed   { background: #d1fae5; color: #065f46; }
    .status-banner.submitted { background: #dbeafe; color: #1e40af; }
    .status-banner.sold-out  { background: #fee2e2; color: #991b1b; }

    /* ── Product Image ── */
    .flash-img-wrap { background: #f9f9f9; }
    .flash-img { width: 100%; max-height: 380px; object-fit: contain; display: block; }

    /* ── Body ── */
    .flash-body { padding: 20px; }

    .flash-name { font-size: 20px; font-weight: 700; line-height: 1.3; margin-bottom: 8px; }
    .flash-desc { font-size: 13px; color: var(--muted); line-height: 1.7; margin-bottom: 16px; }

    /* ── Prices ── */
    .flash-prices { display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline; margin-bottom: 14px; }
    .price-hk { font-size: 24px; font-weight: 800; color: var(--hk); }
    .price-tw { font-size: 24px; font-weight: 800; color: var(--tw); }
    .price-jp { font-size: 14px; font-weight: 600; color: #999; }

    /* ── Qty ── */
    .qty-row { margin-bottom: 20px; }
    .qty-badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 5px 13px; border-radius: 20px;
      font-size: 13px; font-weight: 700;
      border: 1.5px solid;
    }
    .qty-badge.many { background: #f0fdf4; color: #166534; border-color: #bbf7d0; }
    .qty-badge.low  { background: #fff7ed; color: #c2410c; border-color: #fed7aa; }
    .qty-badge.none { background: #fef2f2; color: #991b1b; border-color: #fecaca; }

    /* ── Region Selector ── */
    .region-wrap { margin-bottom: 20px; }
    .region-label {
      font-size: 11px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px;
    }
    .region-btns { display: flex; gap: 8px; }
    .region-btn {
      flex: 1; padding: 11px; border-radius: 10px;
      border: 2px solid var(--border); background: #fafafa;
      font-size: 15px; font-weight: 600; cursor: pointer;
      transition: all 0.15s; text-align: center; line-height: 1.3;
    }
    .region-btn.hk.active { border-color: var(--hk); background: #fef2f2; color: var(--hk); }
    .region-btn.tw.active { border-color: var(--tw); background: #eff6ff; color: var(--tw); }
    .region-btn:not(.active) { color: var(--muted); }

    /* ── Grab Button ── */
    .grab-btn {
      display: block; width: 100%;
      padding: 16px; border: none; border-radius: 12px;
      font-size: 16px; font-weight: 800; cursor: pointer;
      letter-spacing: 0.5px; transition: all 0.15s;
      margin-bottom: 12px;
    }
    .grab-btn.primary { background: #111; color: #fff; }
    .grab-btn.primary:hover:not(:disabled) { background: #333; }
    .grab-btn.success { background: var(--green); color: #fff; }
    .grab-btn.success:hover:not(:disabled) { background: #047857; }
    .grab-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .flash-note { font-size: 12px; color: var(--muted); text-align: center; line-height: 1.6; }

    /* ── Form ── */
    .flash-form { margin-top: 20px; display: flex; flex-direction: column; gap: 14px; }
    .form-row label {
      display: block; font-size: 11px; font-weight: 700;
      color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px;
      margin-bottom: 6px;
    }
    .form-row input, .form-row select, .form-row textarea {
      width: 100%; padding: 11px 14px;
      border: 1.5px solid var(--border); border-radius: 10px;
      font-size: 14px; color: var(--ink); background: #fff;
      outline: none; transition: border-color 0.15s;
      font-family: inherit; appearance: auto;
    }
    .form-row input:focus, .form-row select:focus, .form-row textarea:focus {
      border-color: #111;
    }
    .form-row textarea { resize: vertical; min-height: 72px; }

    /* ── Order Reference ── */
    .order-ref {
      background: var(--bg); border-radius: 10px;
      padding: 16px; text-align: center; margin: 16px 0;
      border: 1px solid var(--border);
    }
    .order-ref-label { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
    .order-ref-code {
      font-size: 22px; font-weight: 800; letter-spacing: 4px;
      font-family: 'Courier New', monospace; color: var(--ink);
    }

    /* ── IG Links ── */
    .ig-links { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
    .ig-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 13px; border-radius: 10px;
      font-size: 14px; font-weight: 700; text-decoration: none;
      transition: opacity 0.15s;
    }
    .ig-btn:hover { opacity: 0.8; }
    .ig-btn.hk { background: #fef2f2; color: var(--hk); border: 1.5px solid #fecaca; }
    .ig-btn.tw { background: #eff6ff; color: var(--tw); border: 1.5px solid #bfdbfe; }

    /* ── Divider ── */
    hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }

    /* ── Sold out ── */
    .sold-out-icon { font-size: 52px; text-align: center; margin: 8px 0 4px; }
    .sold-out-text { font-size: 22px; font-weight: 800; color: #ef4444; text-align: center; margin-bottom: 6px; }
    .sold-out-sub  { font-size: 13px; color: var(--muted); text-align: center; margin-bottom: 20px; }
  </style>
</head>
<body>

<div class="topbar">
  <a href="/" class="topbar-back">← 返回</a>
  <div class="topbar-logo">852hk.81jp</div>
  <div style="width:48px;"></div>
</div>

<div class="container">
  <div id="app">
    <div class="loading">
      <div class="loading-spinner"></div>
      載入中...
    </div>
  </div>
</div>

<script>
const SUPA_URL = 'https://pksqfpirggvsftvqrtji.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBrc3FmcGlyZ2d2c2Z0dnFydGppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MDE3MDQsImV4cCI6MjA5Nzk3NzcwNH0.TyGBeMNn91UCNEVhT-q4ivtgvXQL_GOLmdvtGMUIWuc';
const SUPA_H  = { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}`, 'Content-Type': 'application/json' };
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzgsFv9_AjExH0VCh1m6DX18qTmXMKwO0xiBGQfYqvO2Q6nb5ZNeXRbsdRsbGVcFidIQw/exec';

// Extract slug from pathname: /flash/my-item-slug
const slug = location.pathname.replace(/^\/flash\//, '').replace(/\/$/, '');
const LS_KEY = `flash_claim_${slug}`;

let item = null;
let region = localStorage.getItem('region') || 'hk';
const app = document.getElementById('app');

/* ── Init ──────────────────────────────────────────── */
async function init() {
  if (!slug) { renderNotFound(); return; }

  try {
    const res = await fetch(
      `${SUPA_URL}/rest/v1/flash_stock?slug=eq.${encodeURIComponent(slug)}&select=*`,
      { headers: SUPA_H }
    );
    const rows = await res.json();
    if (!rows || !rows.length) { renderNotFound(); return; }
    item = rows[0];
    document.title = `${item.name} — 852hk.81jp`;
  } catch(e) {
    app.innerHTML = `<div class="loading">載入失敗，請重試</div>`;
    return;
  }

  // Check existing claim in localStorage
  const stored = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
  if (stored && stored.token) {
    region = stored.region || region;
    if (stored.status === 'submitted') { renderSubmitted(stored); return; }
    renderForm(stored.token, stored.region || region); // already grabbed, show form again
    return;
  }

  if (item.qty_available <= 0 || item.status === 'sold_out') {
    renderSoldOut();
  } else {
    renderBrowsing();
  }
}

/* ── Region ─────────────────────────────────────────── */
function setRegion(r) {
  region = r;
  localStorage.setItem('region', r);
  renderBrowsing();
}

/* ── Grab ────────────────────────────────────────────── */
async function grab() {
  const btn = document.getElementById('grabBtn');
  if (!btn || btn.disabled) return;
  btn.disabled = true;
  btn.textContent = '搶緊...';

  try {
    const res = await fetch(`${SUPA_URL}/rest/v1/rpc/grab_flash_item`, {
      method: 'POST',
      headers: SUPA_H,
      body: JSON.stringify({ p_slug: slug, p_region: region })
    });
    const data = await res.json();

    if (data && data.success) {
      const claim = { token: data.token, region, status: 'claimed', claimed_at: Date.now(), item_name: item.name };
      localStorage.setItem(LS_KEY, JSON.stringify(claim));
      renderForm(data.token, region);
    } else {
      item.qty_available = 0;
      item.status = 'sold_out';
      renderSoldOut();
    }
  } catch(e) {
    btn.disabled = false;
    btn.textContent = '⚡ 立即搶購';
    alert('網絡錯誤，請重試');
  }
}

/* ── Submit ──────────────────────────────────────────── */
async function handleSubmit(e) {
  e.preventDefault();
  const form = e.target;
  const token = form.dataset.token;
  const btn = form.querySelector('button[type=submit]');
  btn.disabled = true;
  btn.textContent = '提交中...';

  const body = {
    customer_name: form.querySelector('[name=cname]').value.trim(),
    phone:         form.querySelector('[name=phone]').value.trim(),
    email:         form.querySelector('[name=email]').value.trim(),
    pay_method:    form.querySelector('[name=pay_method]').value,
    remark:        form.querySelector('[name=remark]').value.trim(),
    status:        'submitted',
    submitted_at:  new Date().toISOString()
  };

  if (!body.customer_name || !body.phone || !body.email) {
    alert('請填寫姓名、電話及電郵');
    btn.disabled = false;
    btn.textContent = '提交訂單';
    return;
  }

  try {
    // 唔再直接 PATCH 張表 —— 直接 PATCH 即係任何人都改到人哋張單。
    // 呢個 function 要成條 token 先改到，而且改咗一次就唔再收。
    const res = await fetch(`${SUPA_URL}/rest/v1/rpc/submit_flash_order`, {
      method: 'POST',
      headers: { ...SUPA_H, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        p_token: token,          p_name:   body.customer_name,
        p_phone: body.phone,     p_email:  body.email,
        p_pay_method: body.pay_method, p_remark: body.remark,
      })
    });
    if (!res.ok) throw new Error('submit failed');
    const out = await res.json();
    if (out && out.success === false) throw new Error(out.message || 'submit failed');

    // Update localStorage
    const claim = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
    Object.assign(claim, { status: 'submitted', customer_name: body.customer_name, pay_method: body.pay_method });
    localStorage.setItem(LS_KEY, JSON.stringify(claim));

    // Fire-and-forget GAS notification
    fetch(GAS_URL, {
      method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'flashOrderNotify', token, item_name: item.name, region, ...body })
    }).catch(() => {});

    renderSubmitted(claim);
  } catch(err) {
    btn.disabled = false;
    btn.textContent = '提交訂單';
    alert('提交失敗，請重試或聯絡我們');
  }
}

/* ── Render helpers ──────────────────────────────────── */
function imgHtml() {
  if (!item || !item.image_url) return '';
  return `<div class="flash-img-wrap">
    <img class="flash-img" src="${item.image_url}" alt="${esc(item.name)}" onerror="this.parentElement.style.display='none'">
  </div>`;
}

function pricesHtml(reg) {
  const parts = [];
  if (item.price_hkd) parts.push(`<span class="price-hk">HK$ ${item.price_hkd}</span>`);
  if (item.price_twd) parts.push(`<span class="price-tw">NT$ ${item.price_twd}</span>`);
  if (item.price_jpy) parts.push(`<span class="price-jp">¥ ${item.price_jpy}</span>`);
  return parts.length ? `<div class="flash-prices">${parts.join('')}</div>` : '';
}

function singlePriceHtml(reg) {
  const isHK = reg === 'hk';
  if (isHK && item.price_hkd) return `<div class="flash-prices"><span class="price-hk">HK$ ${item.price_hkd}</span>${item.price_jpy ? `<span class="price-jp">¥ ${item.price_jpy}</span>` : ''}</div>`;
  if (!isHK && item.price_twd) return `<div class="flash-prices"><span class="price-tw">NT$ ${item.price_twd}</span>${item.price_jpy ? `<span class="price-jp">¥ ${item.price_jpy}</span>` : ''}</div>`;
  return pricesHtml(reg);
}

function qtyHtml() {
  const n = item.qty_available;
  if (n <= 0) return `<span class="qty-badge none">售罄</span>`;
  const cls = n === 1 ? 'low' : 'many';
  return `<span class="qty-badge ${cls}">剩餘 ${n} 件</span>`;
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ── Render: Browsing ──────────────────────────────── */
function renderBrowsing() {
  app.innerHTML = `
    <div class="flash-card">
      ${imgHtml()}
      <div class="flash-body">
        <div class="flash-name">${esc(item.name)}</div>
        ${item.description ? `<div class="flash-desc">${esc(item.description)}</div>` : ''}
        ${pricesHtml(region)}
        <div class="qty-row">${qtyHtml()}</div>

        <div class="region-wrap">
          <div class="region-label">你係</div>
          <div class="region-btns">
            <button class="region-btn hk ${region==='hk'?'active':''}" onclick="setRegion('hk')">🇭🇰 香港</button>
            <button class="region-btn tw ${region==='tw'?'active':''}" onclick="setRegion('tw')">🇹🇼 台灣</button>
          </div>
        </div>

        <button class="grab-btn primary" id="grabBtn" onclick="grab()">⚡ 立即搶購</button>
        <div class="flash-note">HK / TW 共用庫存 · 搶到後請盡快填寫資料</div>
      </div>
    </div>`;
}

/* ── Render: Form ────────────────────────────────────── */
function renderForm(token, reg) {
  const isHK = reg === 'hk';
  const payOpts = isHK
    ? ['FPS（轉數快）','PayMe'].map(v=>`<option>${v}</option>`).join('')
    : ['郵局銀行匯款'].map(v=>`<option>${v}</option>`).join('');

  app.innerHTML = `
    <div class="flash-card">
      <div class="status-banner grabbed">✅ 已搶到！請填寫資料完成下單</div>
      ${imgHtml()}
      <div class="flash-body">
        <div class="flash-name">${esc(item.name)}</div>
        ${singlePriceHtml(reg)}

        <form class="flash-form" data-token="${token}" onsubmit="handleSubmit(event)">
          <div class="form-row">
            <label>姓名 *</label>
            <input name="cname" type="text" required placeholder="你的真實姓名" autocomplete="name">
          </div>
          <div class="form-row">
            <label>電話 *</label>
            <input name="phone" type="tel" required placeholder="${isHK ? '香港手機號碼' : '台灣手機號碼'}" autocomplete="tel">
          </div>
          <div class="form-row">
            <label>電郵 *</label>
            <input name="email" type="email" required placeholder="確認信發往此信箱" autocomplete="email">
          </div>
          <div class="form-row">
            <label>付款方式</label>
            <select name="pay_method">${payOpts}</select>
          </div>
          <div class="form-row">
            <label>備註（取貨方式 / 問題）</label>
            <textarea name="remark" placeholder="${isHK ? '例如：希望面交旺角...' : '例如：7-11 門市...'}"></textarea>
          </div>
          <button type="submit" class="grab-btn success">提交訂單</button>
        </form>

        <hr>
        <div class="flash-note">
          有問題請 IG 聯絡<br>
          <a href="${isHK ? 'https://ig.me/m/852hk.81jp' : 'https://ig.me/m/886tw.81jp'}"
             style="font-weight:700; color:${isHK ? 'var(--hk)' : 'var(--tw)'};">
            📩 @${isHK ? '852hk.81jp' : '886tw.81jp'}
          </a>
        </div>
      </div>
    </div>`;
}

/* ── 付款資訊（可在此更改） ───────────────────────────── */
const FLASH_PAY = {
  hk: {
    'FPS（轉數快）': '轉數快號碼：<strong>8890873</strong><br>帳戶持有人：<strong>Chow W. Y.</strong>',
    'PayMe': '一按即 PayMe：<a href="https://payme.hsbc/miru" style="color:#ef4444;font-weight:700;">payme.hsbc/miru</a>',
  },
  tw: {
    '郵局銀行匯款': '銀行：<strong>中華郵政（郵局）</strong><br>局號／帳號：<strong>0041860-0025565</strong><br>戶名：<strong>周◯恩</strong>',
  },
};

/* ── Render: Submitted（顯示付款資訊） ────────────────── */
function renderSubmitted(claim) {
  const ref = (claim.token || '').slice(0, 8).toUpperCase();
  const reg = claim.region || region || 'hk';
  const isHK = reg === 'hk';
  const price = item ? (isHK ? item.price_hkd : item.price_twd) : 0;
  const currency = isHK ? 'HK$' : 'NT$';

  const regionPay = FLASH_PAY[reg] || FLASH_PAY.hk;
  const chosen = claim.pay_method && regionPay[claim.pay_method] ? { [claim.pay_method]: regionPay[claim.pay_method] } : regionPay;
  const payHtml = Object.entries(chosen).map(([label, detail]) => `
    <div style="border:2px solid #e8e6e1;border-radius:12px;padding:14px 16px;margin-bottom:10px;text-align:left;">
      <div style="font-size:14px;font-weight:700;margin-bottom:6px;">${label}</div>
      <div style="font-size:13px;line-height:1.8;color:#374151;">${detail}</div>
    </div>`).join('');

  app.innerHTML = `
    <div class="flash-card">
      <div class="status-banner submitted">🎉 搶購成功！請完成付款</div>
      ${imgHtml()}
      <div class="flash-body">
        <div class="flash-name">${item ? esc(item.name) : '現貨'}</div>
        <div class="order-ref">
          <div class="order-ref-label">訂單參考編號</div>
          <div class="order-ref-code">${ref}</div>
        </div>
        ${price ? `<div style="font-size:15px;font-weight:700;margin:12px 0 4px;">付款金額：${currency}${Number(price).toLocaleString()}</div>` : ''}
        <div style="margin-top:12px;">${payHtml}</div>
        <div style="background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:12px;font-size:12px;color:#92400e;line-height:1.7;text-align:left;margin-bottom:16px;">
          ⚠️ 付款時請於備註填寫參考編號 <strong>${ref}</strong>，並將付款截圖傳給我們。<br>
          我們確認收款後會發送確認 Email 給你，安排取貨／寄送詳情。
        </div>
        <a href="/status?id=${ref}" style="display:block;text-align:center;border:1px solid #e8e6e1;border-radius:10px;padding:11px;font-size:13px;font-weight:600;color:#1a1a1a;text-decoration:none;margin-bottom:14px;">📦 查詢訂單狀態 →</a>
        <div class="ig-links">
          <a class="ig-btn hk" href="https://ig.me/m/852hk.81jp">📩 香港 IG @852hk.81jp</a>
